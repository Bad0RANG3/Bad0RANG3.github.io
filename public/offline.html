<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe4">
  <title>暂时离线 · Bad0RANG3's Studio</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4efe4; color: #1a1612; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(28px, 7vw, 64px); border: 3px solid currentColor; border-radius: 28px; background: rgba(255,255,255,.48); box-shadow: 10px 10px 0 #1a1612; }
    .eyebrow { margin: 0 0 16px; font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .95; letter-spacing: -.06em; }
    p { max-width: 46ch; margin: 24px 0 0; font-size: 1.05rem; line-height: 1.75; opacity: .78; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a, button { border: 2px solid currentColor; border-radius: 999px; padding: 11px 17px; color: inherit; background: transparent; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
    a:hover, button:hover { background: #1a1612; color: #f4efe4; }
    small { display: block; margin-top: 28px; opacity: .52; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; background: #1a1612; color: #f4efe4; } main { background: rgba(50, 43, 36, .85); box-shadow: 10px 10px 0 #f4efe4; } a:hover, button:hover { background: #f4efe4; color: #1a1612; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Bad0RANG3's Studio · 离线模式</p>
    <h1>暂时离线</h1>
    <p>当前网络不可用。你仍然可以打开已经缓存的页面；网络恢复后，重新加载即可继续浏览。</p>
    <nav>
      <button type="button" onclick="location.reload()">重新加载</button>
      <a href="./">返回首页</a>
      <a href="./posts/">查看文章</a>
    </nav>
    <small>这个页面由浏览器本地缓存提供，不会发送额外的统计请求。</small>
  </main>
</body>
</html>
